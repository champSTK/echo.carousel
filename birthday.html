<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      font-family: 'Playfair Display', serif;
      padding: 40px;
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 40px;
      left: 40px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      z-index: 100;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .back-button svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    h1 {
      font-size: 80px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 60px;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeInDown 1s ease-out forwards;
    }

    .video-container {
      filter: drop-shadow(0 0 60px rgba(255, 255, 255, 0.6)) 
              drop-shadow(0 0 120px rgba(255, 255, 255, 0.3));
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeInScale 0.8s ease-out 0.3s forwards;
    }

    video {
      width: 720px;
      height: 405px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 
        0 0 80px rgba(255, 255, 255, 0.4),
        0 0 160px rgba(255, 255, 255, 0.2),
        inset 0 0 40px rgba(255, 255, 255, 0.1);
    }

    p {
      font-size: 48px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      text-align: center;
      font-style: italic;
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeInUp 1s ease-out 0.6s forwards;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .back-button {
        top: 20px;
        left: 20px;
        width: 48px;
        height: 48px;
      }

      .back-button svg {
        width: 20px;
        height: 20px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 40px;
      }
      
      video {
        width: 90vw;
        height: auto;
        aspect-ratio: 16/9;
      }
      
      p {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <!-- Back Button -->
  <button class="back-button" onclick="window.history.back()" aria-label="Go back">
    <svg viewBox="0 0 24 24">
      <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
    </svg>
  </button>

  <h1>Happy Birthday! 🎉</h1>

  <div class="video-container">
    <video autoplay loop muted playsinline>
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
    </video>
  </div>
<!--https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4-->
  <p>Best Wishes ✨</p>
</body>
</html>
